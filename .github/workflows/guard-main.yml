name: Guardar branch main

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  bloquear-pr-indesejado:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validar origem do PR para main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$HEAD_BRANCH" == "develop" && "$HEAD_REPO" == "$TARGET_REPO" ]]; then
            echo "Release PR develop → main reconhecido; revisão e merge continuam humanos."
            exit 0
          fi
          gh pr close "$PR_NUMBER" --repo "$TARGET_REPO" \
            --comment "PR para main não permitido a partir desta origem. Features devem abrir PR para develop; somente develop pode propor release para main."
          echo "PR de origem não autorizada fechado: $HEAD_REPO:$HEAD_BRANCH → main" >&2
          exit 1

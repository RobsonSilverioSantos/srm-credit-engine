<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1240" viewBox="0 0 1680 1240" role="img" aria-label="SRM Credit Engine — Aceite, execução e confirmação">
<title>SRM Credit Engine — Aceite, execução e confirmação</title><desc>Diagrama vetorial SRM Credit Engine de arquitetura de alta escala. A fonte Mermaid editável está no arquivo mmd correspondente.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker></defs>
<rect width="1680" height="1240" fill="#f8fafc"/><text x="52" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="26" fill="#0f172a">SRM Credit Engine — Aceite, execução e confirmação</text>
<text x="52" y="94" font-family="DejaVu Sans, Arial" fill="#475569" font-size="17">Aceite ≠ liquidação • efeito financeiro único por recebível • status consultável</text><rect x="0" y="123" width="180" height="57" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="90" y="157" font-family="DejaVu Sans, Arial" font-size="14" text-anchor="middle" font-weight="700" fill="#1e3a8a">Cliente</text><path d="M90 180 V1172" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 7"/><rect x="242" y="123" width="180" height="57" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="332" y="157" font-family="DejaVu Sans, Arial" font-size="14" text-anchor="middle" font-weight="700" fill="#1e3a8a">Command API</text><path d="M332 180 V1172" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 7"/><rect x="484" y="123" width="180" height="57" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="574" y="157" font-family="DejaVu Sans, Arial" font-size="14" text-anchor="middle" font-weight="700" fill="#1e3a8a">Command Store</text><path d="M574 180 V1172" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 7"/><rect x="726" y="123" width="180" height="57" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="816" y="157" font-family="DejaVu Sans, Arial" font-size="14" text-anchor="middle" font-weight="700" fill="#1e3a8a">Kafka</text><path d="M816 180 V1172" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 7"/><rect x="968" y="123" width="180" height="57" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="1058" y="157" font-family="DejaVu Sans, Arial" font-size="14" text-anchor="middle" font-weight="700" fill="#1e3a8a">Worker</text><path d="M1058 180 V1172" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 7"/><rect x="1210" y="123" width="180" height="57" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="1300" y="157" font-family="DejaVu Sans, Arial" font-size="14" text-anchor="middle" font-weight="700" fill="#1e3a8a">PostgreSQL</text><path d="M1300 180 V1172" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 7"/><rect x="1452" y="123" width="180" height="57" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="1542" y="157" font-family="DejaVu Sans, Arial" font-size="14" text-anchor="middle" font-weight="700" fill="#1e3a8a">Status Query</text><path d="M1542 180 V1172" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 7"/><path d="M97 230 L325 230" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/><rect x="95" y="201" width="232" height="23" rx="5" fill="#f8fafc" opacity="0.96"/><text x="211" y="218" font-family="DejaVu Sans, Arial" font-size="13" text-anchor="middle" font-weight="600" fill="#334155">1. POST + Idempotency-Key</text><path d="M339 289 L567 289" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/><rect x="337" y="260" width="232" height="23" rx="5" fill="#f8fafc" opacity="0.96"/><text x="453" y="277" font-family="DejaVu Sans, Arial" font-size="13" text-anchor="middle" font-weight="600" fill="#334155">2. Intenção + hash + outbox</text><path d="M567 348 L339 348" fill="none" stroke="#0d9488" stroke-width="2.2" marker-end="url(#blue)"/><rect x="337" y="319" width="232" height="23" rx="5" fill="#f8fafc" opacity="0.96"/><text x="453" y="336" font-family="DejaVu Sans, Arial" font-size="13" text-anchor="middle" font-weight="600" fill="#334155">3. COMMIT durável</text><path d="M325 407 L97 407" fill="none" stroke="#0d9488" stroke-width="2.2" marker-end="url(#blue)"/><rect x="95" y="378" width="232" height="23" rx="5" fill="#f8fafc" opacity="0.96"/><text x="211" y="395" font-family="DejaVu Sans, Arial" font-size="13" text-anchor="middle" font-weight="600" fill="#334155">4. 202 Accepted + operationId</text><path d="M581 466 L809 466" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/><rect x="579" y="437" width="232" height="23" rx="5" fill="#f8fafc" opacity="0.96"/><text x="695" y="454" font-family="DejaVu Sans, Arial" font-size="13" text-anchor="middle" font-weight="600" fill="#334155">5. Relay publica comando</text><path d="M823 525 L1051 525" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/><rect x="821" y="496" width="232" height="23" rx="5" fill="#f8fafc" opacity="0.96"/><text x="937" y="513" font-family="DejaVu Sans, Arial" font-size="13" text-anchor="middle" font-weight="600" fill="#334155">6. Partição por recebível</text><path d="M1065 584 L1293 584" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/><rect x="1063" y="555" width="232" height="23" rx="5" fill="#f8fafc" opacity="0.96"/><text x="1179" y="572" font-family="DejaVu Sans, Arial" font-size="13" text-anchor="middle" font-weight="600" fill="#334155">7. Verificar idem + estado</text><path d="M1065 643 L1293 643" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/><rect x="1063" y="614" width="232" height="23" rx="5" fill="#f8fafc" opacity="0.96"/><text x="1179" y="631" font-family="DejaVu Sans, Arial" font-size="11" text-anchor="middle" font-weight="600" fill="#334155">8. COMMIT: liquidação + snapshot + auditoria + idem + outbox</text><path d="M1293 702 L1065 702" fill="none" stroke="#0d9488" stroke-width="2.2" marker-end="url(#blue)"/><rect x="1063" y="673" width="232" height="23" rx="5" fill="#f8fafc" opacity="0.96"/><text x="1179" y="690" font-family="DejaVu Sans, Arial" font-size="13" text-anchor="middle" font-weight="600" fill="#334155">9. Resultado ou replay original / conflito</text><path d="M1051 761 L823 761" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/><rect x="821" y="732" width="232" height="23" rx="5" fill="#f8fafc" opacity="0.96"/><text x="937" y="749" font-family="DejaVu Sans, Arial" font-size="13" text-anchor="middle" font-weight="600" fill="#334155">10. Offset após resultado durável</text><path d="M1307 820 L1535 820" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/><rect x="1305" y="791" width="232" height="23" rx="5" fill="#f8fafc" opacity="0.96"/><text x="1421" y="808" font-family="DejaVu Sans, Arial" font-size="13" text-anchor="middle" font-weight="600" fill="#334155">11. Outbox → Kafka → projeção de status</text><path d="M97 879 L325 879" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/><rect x="95" y="850" width="232" height="23" rx="5" fill="#f8fafc" opacity="0.96"/><text x="211" y="867" font-family="DejaVu Sans, Arial" font-size="13" text-anchor="middle" font-weight="600" fill="#334155">12. GET /operacoes/{id}</text><path d="M339 938 L1535 938" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/><rect x="337" y="909" width="1200" height="23" rx="5" fill="#f8fafc" opacity="0.96"/><text x="937" y="926" font-family="DejaVu Sans, Arial" font-size="13" text-anchor="middle" font-weight="600" fill="#334155">13. Consultar status</text><path d="M1535 997 L339 997" fill="none" stroke="#0d9488" stroke-width="2.2" marker-end="url(#blue)"/><rect x="337" y="968" width="1200" height="23" rx="5" fill="#f8fafc" opacity="0.96"/><text x="937" y="985" font-family="DejaVu Sans, Arial" font-size="13" text-anchor="middle" font-weight="600" fill="#334155">14. Resultado por item / lote</text><path d="M325 1056 L97 1056" fill="none" stroke="#0d9488" stroke-width="2.2" marker-end="url(#blue)"/><rect x="95" y="1027" width="232" height="23" rx="5" fill="#f8fafc" opacity="0.96"/><text x="211" y="1044" font-family="DejaVu Sans, Arial" font-size="13" text-anchor="middle" font-weight="600" fill="#334155">15. Estado atual</text><rect x="42" y="1140" width="1590" height="62" rx="12" fill="#fff7ed" stroke="#ea580c"/><text x="62" y="1164" font-family="DejaVu Sans, Arial" font-size="15" font-weight="700" fill="#9a3412">Ramos da execução financeira:</text><text x="62" y="1190" font-family="DejaVu Sans, Arial" font-size="14" fill="#7c2d12">Replay retorna o resultado anterior; conflito não cria liquidação; sucesso confirma todos os efeitos do recebível em um único commit.</text></svg>
<rect width="1580" height="1040" fill="#f8fafc"/><text x="52" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="26" fill="#0f172a">SRM Credit Engine — Fluxo de alta escala</text>

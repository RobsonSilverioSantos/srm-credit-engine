rect x="1205" y="335" width="320" height="82" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/><text x="1365" y="381" text-anchor="middle" font-size="16" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">Outbox Relay / CDC</text><rect x="820" y="335" width="320" height="82" rx="14" fill="#fdf4ff" stroke="#9333ea" stroke-width="2"/><text x="980" y="369" text-anchor="middle" font-size="16" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">Kafka • Comandos</text><text x="980" y="393" text-anchor="middle" font-size="13" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">Partição por orgId:recebivelId</text><rect x="435" y="335" width="320" height="82" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/><text x="595" y="369" text-anchor="middle" font-size="16" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">Consumers / Single Writer</text><text x="595" y="393" text-anchor="middle" font-size="13" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">Execução serial por agregado</text><rect x="50" y="335" width="320" height="82" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="210" y="369" text-anchor="middle" font-size="16" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">Buckets / Routing Registry</text><text x="210" y="393" text-anchor="middle" font-size="13" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">Fencing / época de roteamento</text><path d="M1205 376 L1140 376" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><path d="M820 376 L755 376" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><path d="M435 376 L370 376" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><path d="M210 417 L210 530" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="50" y="530" width="320" height="82" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/><text x="210" y="564" text-anchor="middle" font-size="16" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">Célula financeira A</text><text x="210" y="588" text-anchor="middle" font-size="13" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">Serviço hexagonal</text><rect x="435" y="530" width="320" height="82" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="595" y="564" text-anchor="middle" font-size="16" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">PostgreSQL A</text><text x="595" y="588" text-anchor="middle" font-size="13" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">ACID + idem + outbox</text><rect x="820" y="530" width="320" height="82" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/><text x="980" y="564" text-anchor="middle" font-size="16" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">Célula financeira B</text><text x="980" y="588" text-anchor="middle" font-size="13" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">Serviço hexagonal</text><rect x="1205" y="530" width="320" height="82" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="1365" y="564" text-anchor="middle" font-size="16" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">PostgreSQL B</text><text x="1365" y="588" text-anchor="middle" font-size="13" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">ACID + idem + outbox</text><path d="M370 571 L435 571" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><path d="M1140 571 L1205 571" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><path d="M210 417 L210 465 L980 465 L980 530" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M595 612 L595 690 L1365 690 L1365 755" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M1365 612 L1365 730" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="1205" y="755" width="320" height="82" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/><text x="1365" y="789" text-anchor="middle" font-size="16" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">Outbox de resultados</text><text x="1365" y="813" text-anchor="middle" font-size="13" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">Relay financeiro</text><rect x="820" y="755" width="320" height="82" rx="14" fill="#fdf4ff" stroke="#9333ea" stroke-width="2"/><text x="980" y="789" text-anchor="middle" font-size="16" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">Kafka • Eventos</text><text x="980" y="813" text-anchor="middle" font-size="13" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">Entrega ao menos uma vez</text><rect x="435" y="755" width="320" height="82" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/><text x="595" y="789" text-anchor="middle" font-size="16" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">Orquestrador de lotes</text><text x="595" y="813" text-anchor="middle" font-size="13" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">Resultados independentes</text><rect x="50" y="755" width="320" height="82" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="210" y="789" text-anchor="middle" font-size="16" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">CQRS + Redis</text><text x="210" y="813" text-anchor="middle" font-size="13" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a">Extratos e consultas eventuais</text><path d="M1205 796 L1140 796" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M820 796 L755 796" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M435 796 L370 796" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="52" y="922" width="1470" height="72" rx="12" fill="#e2e8f0"/><text x="75" y="951" font-family="DejaVu Sans, Arial" font-size="17" font-weight="700" fill="#0f172a">Regra de integridade:</text><text x="75" y="980" font-family="DejaVu Sans, Arial" font-size="16" fill="#334155">1 recebível = 1 unidade ACID; lote = orquestração com resultado parcial; cache não decide liquidação.</text></svg>
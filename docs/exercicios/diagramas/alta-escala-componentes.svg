<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="1040" viewBox="0 0 1580 1040" role="img" aria-label="SRM Credit Engine — Fluxo de alta escala">
<title>SRM Credit Engine — Fluxo de alta escala</title><desc>Diagrama vetorial SRM Credit Engine de arquitetura de alta escala. A fonte Mermaid editável está no arquivo mmd correspondente.</desc>
